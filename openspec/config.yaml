# SDD configuration for deep-wiki2
schema: spec-driven

context: |
  Bun 1.4 monorepo, Bun workspaces + `bun run -F` (no pnpm, no Turborepo).
  apps/landing Astro, apps/web Nuxt 4 + Nuxt UI, apps/api Hono on Bun.
  packages/core (framework-free domain), packages/markdown (unified/remark),
  packages/contracts (zod), packages/editor (Milkdown/ProseMirror), packages/db (Drizzle).
  Postgres + pgvector; podman compose (dev), docker (prod). Playwright for e2e.
  No source code exists yet — pre-Phase-0. See docs/SPECS.md and docs/TODO.md.

artifact_store: hybrid

execution_mode:
  mode: auto
  human_gates:
    - "Every new UI screen or interaction stops for owner review before work continues."

delivery_strategy: single-pr

review:
  budget_lines: unlimited
  accepted_exception: "size:exception"

strict_tdd: false
strict_tdd_note: >
  Fails closed to false at init because zero projects/test runners exist yet
  (pre-Phase-0, no package.json anywhere in the workspace). Re-resolve once
  Phase 0 scaffolding lands a workspace-level `bun test` command covering every
  package/app, and Playwright is wired for e2e. Do not treat this as a
  downgrade of the session's Strict TDD intent — it is the required no-runner
  fallback.

testing:
  status: pending
  expected_unit_integration_runner: "bun test"
  expected_e2e_runner: "playwright"
  projects: []

rules:
  proposal:
    - Include a rollback plan for risky changes.
    - Flag any change touching GATE-1 (permissions), GATE-2 (markdown round-trip),
      or GATE-3 (vector tenant isolation) from docs/TODO.md explicitly.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
  design:
    - Document architecture decisions with rationale, consistent with docs/SPECS.md §14.
    - Keep packages/core free of framework imports; call this out when a design touches it.
  tasks:
    - Group by phase, matching docs/TODO.md roadmap phases where applicable.
    - Keep tasks completable in one session.
    - Any task introducing a new UI screen or interaction MUST be marked as a
      human-review checkpoint per the execution_mode human_gates rule above.
  apply:
    guidelines:
      - Follow the hexagonal boundaries from docs/SPECS.md (packages/core has zero
        framework imports; MailSender and BlobStore are ports with adapters).
      - Reuse packages/markdown as the single parser for editor, api, and indexer.
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
