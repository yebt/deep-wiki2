# Test-only Mailpit and MinIO, for apps/api's adapter tests (SMTP against
# Mailpit — Phase 12; S3-compatible storage against MinIO — Phase 15).
#
# Deliberately separate from the repository root's compose.yaml and from
# packages/db/testing/compose.yaml: this machine (like any self-hoster's)
# may already run unrelated services on the dev stack's ports (1025, 8025,
# 9000 — verified occupied by unrelated projects during this change), so
# this stack uses dedicated test-only ports instead.
#
# Project name and published ports are per-worktree so two git worktrees
# can run their suites at the same time; see packages/db/testing/
# worktree.ts, which derives them from the worktree's absolute path and
# passes them in the compose process's environment. The defaults below are
# the main checkout's values.
#
# From a linked worktree, drive this file by hand with the matching
# environment:  eval "$(bun run packages/db/testing/worktree.ts)"
name: ${COMPOSE_PROJECT_NAME:-deep-wiki-api-test}

services:
  mailpit:
    image: axllent/mailpit
    ports:
      - "${DEEPWIKI_TEST_MAILPIT_SMTP_PORT:-11025}:1025"
      - "${DEEPWIKI_TEST_MAILPIT_HTTP_PORT:-18025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dw_test
      MINIO_ROOT_PASSWORD: dw_test_password
    ports:
      - "${DEEPWIKI_TEST_MINIO_PORT:-19000}:9000"
      - "${DEEPWIKI_TEST_MINIO_CONSOLE_PORT:-19001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
