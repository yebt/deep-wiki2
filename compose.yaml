# Local development stack (docs/SPECS.md §12). Strictly Compose-spec syntax —
# no `container_name`, no `develop.watch`, no other Docker- or Podman-specific
# extension — so this exact file runs unmodified under `podman compose`
# (Fedora, rootless, local dev) and `docker compose` (CI's compose-smoke job,
# and production). Every value read from the shell/`.env` environment fails
# fast with `${VAR:?message}` rather than silently defaulting to something a
# self-hoster never chose (see design.md D6; verified supported by this
# machine's `podman-compose` provider via `podman compose config -q`).
#
# Bring the stack up:   podman compose up -d --wait
# Tear it down:         podman compose down -v
name: deep-wiki

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set — see env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see env.example}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set — see env.example}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Named volumes need no SELinux label; this is the one bind mount in
      # the stack and it carries :z (design.md D7).
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set — see env.example}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set — see env.example}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set — see env.example}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kroki cannot render Mermaid on its own (verified against Kroki's own
  # documentation) — it needs the companion `mermaid` service below AND the
  # KROKI_MERMAID_HOST variable naming that service, or the sidecar starts
  # and never receives a single request.
  kroki:
    image: yuzutech/kroki
    environment:
      KROKI_MERMAID_HOST: mermaid
    ports:
      - "8000:8000"
    depends_on:
      mermaid:
        condition: service_started

  mermaid:
    image: yuzutech/kroki-mermaid

volumes:
  pgdata:
  miniodata:
